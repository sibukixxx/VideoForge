name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: cargo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Real-FFmpeg tests (crates/videoforge-preview/tests/ffmpeg_real.rs)
      # skip themselves when no ffmpeg is on PATH; installing one here is
      # what makes them run on every OS of the matrix (issue #12).
      - uses: FedericoCarboni/setup-ffmpeg@v3
        id: ffmpeg
        continue-on-error: true
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build CLI
        run: cargo build -p videoforge-cli --release
      - name: smoke (offline pipeline)
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/target/release/videoforge"
          cd "$RUNNER_TEMP"
          "$BIN" init demo --name demo
          cd demo
          cp "$GITHUB_WORKSPACE/fixtures/templates/ymm4/default.ymmp" templates/ymm4/default.ymmp
          "$BIN" validate scripts/sample.md
          "$BIN" generate scripts/sample.md --fake-tts --no-preview
          "$BIN" bundle ymm4 generated/sample/project.vfp.json
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$BIN" export ymm4 generated/sample/project.vfp.json
            test -f generated/sample/ymm4/project.ymmp
          else
            ! "$BIN" export ymm4 generated/sample/project.vfp.json
          fi

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Linux WebKitGTK prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - name: frontend typecheck + build
        run: pnpm build
      - name: rust fmt
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - name: rust clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - name: rust test
        run: cargo test
        working-directory: apps/desktop/src-tauri
